<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Hotech studio | Web Systems & Digital Solutions</title>

    <meta
      name="description"
      content="Hotech builds practical web systems that replace manual and repetitive workflows with simple, reliable digital solutions for businesses."
    />

    <meta
      name="author"
      content="Hillary Omondi Ochieng"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0B0F17"
      media="(prefers-color-scheme: dark)"
    />

    <meta
      name="theme-color"
      content="#F8FAFC"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/light-logo.svg"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Hotech | Web Systems & Digital Solutions"
    />

    <meta
      property="og:description"
      content="Practical web systems that replace manual and repetitive workflows with simple, reliable digital solutions."
    />

    <meta
      property="og:url"
      content="%VITE_SITE_URL%"
    />

    <meta
      property="og:image"
      content="%VITE_SITE_URL%/preview.png"
    />

    <meta
      property="og:image:alt"
      content="Hotech — Web Systems and Digital Solutions"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Hotech | Web Systems & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="Hotech builds practical web systems that replace manual and repetitive workflows with simple, reliable digital solutions."
    />

    <meta
      name="twitter:image"
      content="%VITE_SITE_URL%/preview.png"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="%VITE_SITE_URL%/"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
